<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Capture Form</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { margin-bottom: 15px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #message { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Submit Lead</h2>
        <form id="leadForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <button type="submit">Submit Data</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = "Submitting...";

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            fetch('https://script.google.com/macros/s/AKfycbzJd64doPN1A4lCkWsfKF0eg7WPRGh1l_tbGjvso4Pkp0sBcC4D8DFcRfuurz5gUEb-GQ/exec', {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                msgDiv.style.color = "green";
                msgDiv.innerText = "Data submitted successfully!";
                document.getElementById('leadForm').reset();
            })
            .catch(error => {
                msgDiv.style.color = "red";
                msgDiv.innerText = "Error submitting data.";
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
